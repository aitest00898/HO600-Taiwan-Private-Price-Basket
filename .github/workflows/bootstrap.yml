name: Bootstrap HO600 canonical baseline

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/main.tar.xz"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify bootstrap archive
        shell: bash
        run: |
          set -euo pipefail
          echo "085f66c7b28ef29a70d7e2095b2318ca429273b5d5e94d35448f9b04131d23bc  .bootstrap/main.tar.xz" | sha256sum -c -

      - name: Restore canonical repository tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf .bootstrap/main.tar.xz -C .
          rm -rf .bootstrap
          # Workflow files are installed separately by the GitHub connector.
          rm -f .github/workflows/validate.yml

      - name: Validate restored canonical baseline
        run: python scripts/validate_repo.py

      - name: Commit restored repository data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: restore HO600 Batch 8 canonical baseline"
          git push origin main
