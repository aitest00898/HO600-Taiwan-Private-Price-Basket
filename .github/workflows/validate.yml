# Research-branch safety: GitHub Actions automatically running on push is PAUSED by user decision.
# Only the user can explicitly reauthorize Actions execution. Do not dispatch this workflow.
# This branch-specific guard does not change main or the canonical validation policy.
name: Validate HO600

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical state
        run: python scripts/validate_repo.py
